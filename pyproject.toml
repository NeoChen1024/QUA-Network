[project]
name = "qua-network"
version = "0.0.0a0"
description = "Research tools for the QUA Network protocol specification"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE.md", "LICENSES/Apache-2.0.txt"]
authors = [{ name = "Neo_Chen" }]
dynamic = ["dependencies"]

[project.scripts]
qua-is-logger = "qua_network.aprsis_logger:cli"
qua-length-stats = "qua_network.length_stats:cli"
qua-corpus-import = "qua_network.corpus_import:cli"
qua-tocall-stats = "qua_network.tocall_stats:cli"
qua-check-vectors = "qua_network.check_vectors:cli"
qua-make-vectors = "qua_network.make_vectors:cli"
qua-icon-stats = "qua_network.icon_stats:cli"
qua-icon-encode = "qua_network.icon_encode:cli"
qua-spec-extract = "qua_network.spec_extract:cli"
qua-legacy-tokenize = "qua_network.legacy_tokenize:cli"
qua-legacy-fields = "qua_network.legacy_fields:cli"
qua-legacy-examples = "qua_network.legacy_examples:cli"
qua-legacy-decode = "qua_network.legacy_decode:cli"
qua-legacy-compare = "qua_network.legacy_compare:cli"
qua-legacy-values = "qua_network.legacy_values:cli"
qua-legacy-text = "qua_network.legacy_text:cli"
qua-legacy-usx-check = "qua_network.legacy_usx_check:cli"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["pysrc"]

[tool.black]
line-length = 132
target-version = ['py311']
extend-exclude = '/3rdparty/'

[tool.isort]
profile = "black"
line_length = 132
extend_skip = ["3rdparty"]
known_first_party = ["qua_network"]
